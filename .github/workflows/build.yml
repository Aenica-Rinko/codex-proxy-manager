name: Windows build and package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build manager
        run: ./scripts/build.ps1
      - name: Test release safety checks
        run: ./scripts/test-release-safety.ps1
      - name: Audit release candidates (working tree only)
        run: ./scripts/audit-release.ps1
      - name: Run offline unit tests
        run: ./scripts/test.ps1 -UnitOnly
      - name: Verify packaging boundaries
        run: ./scripts/test-package.ps1
      - name: Verify recoverable layout migration
        run: ./scripts/test-layout.ps1
      - name: Verify Windows PowerShell compatibility
        shell: powershell
        run: |
          ./scripts/test-release-safety.ps1
          ./scripts/test.ps1 -UnitOnly
          ./scripts/test-package.ps1
          ./scripts/test-layout.ps1
      - name: Build manager-only package
        run: ./scripts/package.ps1
      # No release publishing or artifact upload until the owner approves public distribution.
